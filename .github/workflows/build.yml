name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PreviewGen-Windows
            ext: exe
          - os: macos-latest
            artifact: PreviewGen-macOS
            ext: dmg
          - os: ubuntu-22.04
            artifact: PreviewGen-Linux
            ext: AppImage

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12.8
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12.8"
      - name: Install dependencies (hash-pinned lock)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev-lock.txt

      - name: Lint Python (ruff)
        run: python -m ruff check .

      # ── Linux: install system webview deps ──
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libgl1-mesa-glx libegl1 fuse libfuse2 xvfb
      # ── Frontend gate: typecheck -> tests -> production bundle ──
      # Packaging must not start unless the frontend passes all three gates.
      - name: Set up Node.js 24.15.0
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "24.15.0"
      - name: Build React frontend
        run: |
          cd frontend
          npm ci
          npm run typecheck
          npm test
          npm run build
          cd ..

      # ── Mandatory Python Test Suite Gate (includes frontend bundle check) ──
      - name: Run Python unit and integration test suite
        env:
          PREVIEWGEN_REQUIRE_FRONTEND_BUNDLE: "1"
        run: |
          python -m pytest tests/ -v -W error::pytest.PytestUnraisableExceptionWarning
      # ── Build with PyInstaller (native windowed .app on macOS) ──
      - name: Build executable
        shell: bash
        run: |
          pyinstaller --noconsole --name PreviewGen --icon=app.ico \
            --add-data "app.ico${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "frontend/dist${{ runner.os == 'Windows' && ';' || ':' }}frontend/dist" \
            --add-data "previewgen/settings_schema.json${{ runner.os == 'Windows' && ';' || ':' }}previewgen" \
            --collect-all psd_tools --collect-all trimesh --collect-all webview \
            --collect-all resvg_py --collect-all matplotlib \
            --collect-all cascadio --collect-all ezdxf --collect-all olefile \
            --collect-all pypdfium2 --collect-all pypdfium2_raw --collect-all fontTools --collect-all brotli \
            ${{ runner.os == 'macOS' && '--osx-bundle-identifier com.zenartisan.previewgen --windowed' || '' }} \
            app.py --clean -y

      - name: Collect build diagnostics and renderer versions
        shell: bash
        run: |
          mkdir -p build_diagnostics
          cp build/PreviewGen/warn-PreviewGen.txt build_diagnostics/ 2>/dev/null || true
          python -c "
          import sys, PIL, trimesh, psd_tools, resvg_py, ezdxf, cascadio
          print('Python:', sys.version)
          print('Pillow:', PIL.__version__)
          print('trimesh:', trimesh.__version__)
          print('psd-tools:', psd_tools.__version__)
          print('ezdxf:', ezdxf.__version__)
          print('cascadio:', getattr(cascadio, '__version__', 'installed'))
          " > build_diagnostics/renderer_versions.txt 2>&1 || true

      - name: Upload build diagnostics artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: diagnostics-${{ matrix.artifact }}
          path: build_diagnostics/

      # ── Packaged (frozen) renderer gate ──
      # Source imports do not prove the packaged app supports every format;
      # exercise the actual frozen artifact against the deterministic fixtures.
      - name: Verify frozen artifact renders fixtures (packaged gate)
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) export PREVIEWGEN_BINARY="dist/PreviewGen/PreviewGen.exe" ;;
            macOS)   export PREVIEWGEN_BINARY="dist/PreviewGen.app/Contents/MacOS/PreviewGen" ;;
            *)       export PREVIEWGEN_BINARY="dist/PreviewGen/PreviewGen" ;;
          esac
          # Enforce a real packaged binary in the release pipeline (fail-closed before pytest runs)
          test -n "$PREVIEWGEN_BINARY" || { echo "FATAL: PREVIEWGEN_BINARY is empty or unset"; exit 1; }
          test -f "$PREVIEWGEN_BINARY" || { echo "FATAL: Frozen artifact not found: $PREVIEWGEN_BINARY"; exit 1; }
          export PREVIEWGEN_RELEASE_GATE=1
          python -m pytest tests/integration/test_release_renderers_gate.py -v -W error
      - name: Windows Startup Test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Running Windows startup smoke test..."
          $proc = Start-Process -FilePath "dist\PreviewGen\PreviewGen.exe" -ArgumentList "--smoke-test" -NoNewWindow -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "Windows startup test failed with exit code $($proc.ExitCode)"
          }
          Write-Host "Windows startup smoke test passed successfully!"

      - name: Sign Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ secrets.WINDOWS_CERTIFICATE }}" -ne "") {
            Write-Host "Signing Windows binary with certificate..."
            $certBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}")
            [IO.File]::WriteAllBytes("cert.pfx", $certBytes)
            & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign /f cert.pfx /p "${{ secrets.WINDOWS_CERTIFICATE_PWD }}" /tr http://timestamp.digicert.com /td sha256 /fd sha256 dist\PreviewGen\PreviewGen.exe
            Remove-Item cert.pfx -Force
          } elseif ("${{ startsWith(github.ref, 'refs/tags/v') }}" -eq "True") {
            throw "FATAL: WINDOWS_CERTIFICATE secret is missing for official production release tag ${{ github.ref }}"
          } else {
            Write-Host "Notice: No WINDOWS_CERTIFICATE secret configured. Skipping Windows binary signing for development build."
          }

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item install_desktop_icon.bat dist\PreviewGen\Install-Desktop-Icon.bat
          Copy-Item app.ico dist\PreviewGen\app.ico
          Copy-Item USER_GUIDE.txt dist\PreviewGen\USER_GUIDE.txt
          Compress-Archive -Path dist\PreviewGen\* -DestinationPath PreviewGen-Windows.zip -Force
          # Compile Inno Setup installer wizard (PreviewGen-Setup.exe)
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer.iss
          Move-Item dist\PreviewGen-Setup.exe .

      - name: Sign Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ secrets.WINDOWS_CERTIFICATE }}" -ne "" -and (Test-Path "PreviewGen-Setup.exe")) {
            Write-Host "Signing Windows setup installer..."
            $certBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}")
            [IO.File]::WriteAllBytes("cert.pfx", $certBytes)
            & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign /f cert.pfx /p "${{ secrets.WINDOWS_CERTIFICATE_PWD }}" /tr http://timestamp.digicert.com /td sha256 /fd sha256 PreviewGen-Setup.exe
            Remove-Item cert.pfx -Force
          }

      # ── macOS: Genuine .app bundle, Code Signing, Startup test & DMG ──
      - name: Package macOS build
        if: runner.os == 'macOS'
        run: |
          test -d "dist/PreviewGen.app" || { echo "FATAL: PyInstaller did not generate dist/PreviewGen.app"; exit 1; }
          test -f "dist/PreviewGen.app/Contents/MacOS/PreviewGen" || { echo "FATAL: Missing executable inside dist/PreviewGen.app"; exit 1; }
          mkdir -p dmg_staging
          cp -R dist/PreviewGen.app dmg_staging/

      - name: Sign macOS Application
        if: runner.os == 'macOS'
        run: |
          APP_PATH="dmg_staging/PreviewGen.app"
          if [ -n "${{ secrets.MACOS_CERTIFICATE }}" ]; then
            echo "Importing Apple Developer Certificate..."
            echo "${{ secrets.MACOS_CERTIFICATE }}" | base64 --decode > certificate.p12
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            security create-keychain -p "" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "" $KEYCHAIN_PATH
            security import certificate.p12 -k $KEYCHAIN_PATH -P "${{ secrets.MACOS_CERTIFICATE_PWD }}" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH
            codesign --deep --force --options runtime --timestamp --sign "${{ secrets.MACOS_DEVELOPER_IDENTITY }}" "$APP_PATH"
            rm -f certificate.p12
          else
            echo "Notice: No MACOS_CERTIFICATE configured. Applying ad-hoc signature..."
            codesign --force --deep --sign - "$APP_PATH"
          fi

      - name: macOS Startup Test
        if: runner.os == 'macOS'
        run: |
          echo "Running macOS startup smoke test..."
          ./dmg_staging/PreviewGen.app/Contents/MacOS/PreviewGen --smoke-test

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "PreviewGen" -srcfolder dmg_staging -ov -format UDZO PreviewGen-macOS.dmg

      - name: Notarize and staple macOS DMG
        if: runner.os == 'macOS'
        run: |
          if [ -n "${{ secrets.APPLE_ID }}" ] && [ -n "${{ secrets.APPLE_TEAM_ID }}" ] && [ -n "${{ secrets.APPLE_APP_PASSWORD }}" ]; then
            echo "Submitting DMG to Apple notary service..."
            xcrun notarytool submit PreviewGen-macOS.dmg \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" \
              --password "${{ secrets.APPLE_APP_PASSWORD }}" \
              --wait
            echo "Stapling notarization ticket to DMG..."
            xcrun stapler staple PreviewGen-macOS.dmg
            xcrun stapler validate PreviewGen-macOS.dmg
          else
            echo "Notice: Notarization secrets not configured. Skipping notarization..."
          fi

      # ── Linux: Startup test & Genuine AppImage ──
      - name: Linux Startup Test
        if: runner.os == 'Linux'
        run: |
          echo "Running Linux executable smoke test..."
          xvfb-run -a ./dist/PreviewGen/PreviewGen --smoke-test

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p PreviewGen.AppDir/usr/bin
          mkdir -p PreviewGen.AppDir/usr/share/applications
          mkdir -p PreviewGen.AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/PreviewGen/* PreviewGen.AppDir/usr/bin/
          python -c "from PIL import Image; Image.open('app.ico').save('PreviewGen.AppDir/previewgen.png')"
          cp PreviewGen.AppDir/previewgen.png PreviewGen.AppDir/.DirIcon
          cp PreviewGen.AppDir/previewgen.png PreviewGen.AppDir/usr/share/icons/hicolor/256x256/apps/previewgen.png

          cat > PreviewGen.AppDir/previewgen.desktop << 'EOF'
          [Desktop Entry]
          Name=PreviewGen
          Exec=PreviewGen
          Icon=previewgen
          Type=Application
          Categories=Graphics;
          Comment=Transparent PNG to JPG Preview Generator
          EOF
          cp PreviewGen.AppDir/previewgen.desktop PreviewGen.AppDir/usr/share/applications/previewgen.desktop

          cat > PreviewGen.AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/PreviewGen" "$@"
          APPRUN
          chmod +x PreviewGen.AppDir/AppRun
          # Pin the AppImage tooling to a stable release and verify its checksum
          # before execution (immutable, auditable build dependency).
          APPIMAGETOOL_VERSION="1.9.1"
          APPIMAGETOOL_URL="https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          APPIMAGETOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          wget -q "$APPIMAGETOOL_URL" -O appimagetool
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c - || {
            echo "FATAL: appimagetool checksum verification failed"; exit 1;
          }
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool PreviewGen.AppDir PreviewGen-Linux.AppImage
          test -f PreviewGen-Linux.AppImage || { echo "FATAL: appimagetool failed to create PreviewGen-Linux.AppImage"; exit 1; }
          chmod +x PreviewGen-Linux.AppImage

      # ── Upload artifact ──
      - name: Upload build artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            PreviewGen-Setup.exe
            PreviewGen-Windows.zip
            PreviewGen-macOS.dmg
            PreviewGen-Linux.AppImage

  # ── Isolated Clean Machine Tests (WITHOUT Python or Node.js) ──
  clean-machine-test:
    name: Clean Machine Test (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PreviewGen-Windows
          - os: macos-latest
            artifact: PreviewGen-macOS
          - os: ubuntu-22.04
            artifact: PreviewGen-Linux

    runs-on: ${{ matrix.os }}
    steps:
      # Crucial: NO actions/setup-python and NO actions/setup-node installed here!
      - name: Checkout render fixtures (source only, no toolchain)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download compiled artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: ${{ matrix.artifact }}

      - name: Test on clean Windows machine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Unpacking Windows artifact on machine without project Python/Node..."
          Expand-Archive -Path PreviewGen-Windows.zip -DestinationPath test_clean_win
          $env:PREVIEWGEN_READY_MARKER = "$PWD\gui_ready.txt"
          $proc = Start-Process -FilePath "test_clean_win\PreviewGen.exe" -ArgumentList "--gui-smoke-test" -NoNewWindow -PassThru -RedirectStandardOutput "$PWD\gui_stdout.log" -RedirectStandardError "$PWD\gui_stderr.log"
          $timeoutSec = 60
          $elapsed = 0
          while (-not $proc.HasExited -and $elapsed -lt $timeoutSec) {
            Start-Sleep -Seconds 1
            $elapsed++
          }
          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force
            Get-Content "$PWD\gui_stdout.log" -ErrorAction SilentlyContinue
            Get-Content "$PWD\gui_stderr.log" -ErrorAction SilentlyContinue
            Get-Content "$env:LOCALAPPDATA\PreviewGen\logs\previewgen.log" -ErrorAction SilentlyContinue
            throw "Clean machine Windows GUI smoke test timed out after $timeoutSec seconds."
          }
          if ($proc.ExitCode -ne 0) {
            Get-Content "$PWD\gui_stdout.log" -ErrorAction SilentlyContinue
            Get-Content "$PWD\gui_stderr.log" -ErrorAction SilentlyContinue
            Get-Content "$env:LOCALAPPDATA\PreviewGen\logs\previewgen.log" -ErrorAction SilentlyContinue
            throw "Clean machine Windows execution failed with code $($proc.ExitCode)"
          }
          if (-not (Test-Path "$PWD\gui_ready.txt")) {
            Get-Content "$PWD\gui_stdout.log" -ErrorAction SilentlyContinue
            Get-Content "$PWD\gui_stderr.log" -ErrorAction SilentlyContinue
            Get-Content "$env:LOCALAPPDATA\PreviewGen\logs\previewgen.log" -ErrorAction SilentlyContinue
            throw "Clean machine Windows GUI failed: frontend_ready marker was not generated by React frontend."
          }
          Write-Host "Verifying frozen binary render capabilities (all fixtures)..."
          $renderProc = Start-Process -FilePath "test_clean_win\PreviewGen.exe" -ArgumentList "--render-test-all --fixtures tests/fixtures" -NoNewWindow -Wait -PassThru
          if ($renderProc.ExitCode -ne 0) {
            throw "Clean machine Windows frozen render test (all fixtures) failed with code $($renderProc.ExitCode)"
          }
          Write-Host "Windows clean machine test passed successfully!"

      - name: Test on clean macOS machine
        if: runner.os == 'macOS'
        run: |
          echo "Mounting macOS DMG on machine without project Python/Node..."
          hdiutil attach PreviewGen-macOS.dmg -mountpoint /Volumes/PreviewGenTest
          export PREVIEWGEN_READY_MARKER="$PWD/gui_ready.txt"
          python3 -c "import subprocess, sys, time; proc = subprocess.Popen(['/Volumes/PreviewGenTest/PreviewGen.app/Contents/MacOS/PreviewGen', '--gui-smoke-test']); sys.exit(proc.wait(timeout=60))" || {
            cat ~/Library/Logs/PreviewGen/previewgen.log 2>/dev/null || true
            echo "FATAL: macOS GUI test failed or timed out after 60s"; exit 1;
          }
          test -f "$PWD/gui_ready.txt" || {
            cat ~/Library/Logs/PreviewGen/previewgen.log 2>/dev/null || true
            echo "FATAL: frontend_ready marker not found on macOS"; exit 1;
          }
          echo "Verifying frozen binary render capabilities on macOS (all fixtures)..."
          /Volumes/PreviewGenTest/PreviewGen.app/Contents/MacOS/PreviewGen --render-test-all --fixtures tests/fixtures
          if [ $? -ne 0 ]; then
            echo "FATAL: macOS frozen render test (all fixtures) failed"
            exit 1
          fi
      - name: Test on clean Linux machine
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo "Testing Linux AppImage on machine without project Python/Node..."
          sudo apt-get update && sudo apt-get install -y xvfb libfuse2 python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 || sudo apt-get install -y xvfb libfuse2 python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.0
          chmod +x PreviewGen-Linux.AppImage
          export PREVIEWGEN_READY_MARKER="$PWD/gui_ready.txt"
          timeout 60s xvfb-run -a ./PreviewGen-Linux.AppImage --gui-smoke-test > previewgen-gui.log 2>&1 || {
            echo "FATAL: Linux GUI smoke test failed or timed out after 60s"
            cat ~/.local/state/previewgen/previewgen.log 2>/dev/null || true
            exit 1
          }
          test -f "$PWD/gui_ready.txt" || {
            echo "FATAL: frontend_ready marker not found on Linux"
            cat previewgen-gui.log
            cat ~/.local/state/previewgen/previewgen.log 2>/dev/null || true
            exit 1
          }
          echo "Verifying frozen AppImage render capabilities on Linux (all fixtures)..."
          ./PreviewGen-Linux.AppImage --render-test-all --fixtures tests/fixtures
          if [ $? -ne 0 ]; then
            echo "FATAL: Linux frozen render test (all fixtures) failed"
            exit 1
          fi

  # ── Release generation with SHA256 checksums ──
  release:
    needs: [build, clean-machine-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          echo "Generating SHA-256 checksums for release verification..."
          sha256sum PreviewGen-* > SHA256SUMS.txt
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@c062e49c7161b9a9f4c3a30dbf2e4663a8a3ad30 # v2.0.8
        with:
          generate_release_notes: true
          files: |
            PreviewGen-Setup.exe
            PreviewGen-Windows.zip
            PreviewGen-macOS.dmg
            PreviewGen-Linux.AppImage
            SHA256SUMS.txt
            USER_GUIDE.txt
