name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PreviewGen-Windows
            ext: exe
          - os: macos-latest
            artifact: PreviewGen-macOS
            ext: dmg
          - os: ubuntu-22.04
            artifact: PreviewGen-Linux
            ext: AppImage

    runs-on: ${{ matrix.os }}
    # Signing and notarization are optional for this free, MIT-licensed
    # project. The Windows and macOS builds sign when a certificate is
    # configured and ship unsigned otherwise, so no build step needs to
    # distinguish a tag build from an ordinary push.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12.8
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.8"
      # ── Linux: system webview deps and gi build headers ──
      # Must run before the pip install: PyGObject has no wheels, so the Linux
      # lock compiles it from source here, and PyInstaller can only bundle the
      # `gi` module that pywebview's GTK backend imports at module scope.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1 gir1.2-gtk-3.0 \
            libgirepository1.0-dev libcairo2-dev pkg-config python3-dev \
            libgl1-mesa-glx libegl1 fuse libfuse2 xvfb binutils

      - name: Install dependencies (hash-pinned lock)
        # bash, not the Windows runner's default pwsh: `if [ ... ]; then` is a
        # PowerShell ParserError, which failed every Windows packaging job.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install --require-hashes -r requirements-linux-gui-lock.txt
          else
            pip install --require-hashes -r requirements-dev-lock.txt
          fi

      - name: Lint Python (ruff)
        run: python -m ruff check .

      - name: Type-check Python (pyrefly)
        run: python -m pyrefly check

      - name: Report release freshness
        # The install scripts resolve /releases/latest, so the newest code a
        # user can obtain is whatever was last published. This step makes the
        # difference between the tree and the published release visible in the
        # job log instead of leaving it to be discovered by a user who
        # installed and found the old build.
        #
        # On a branch it only reports: a stale release is a publishing
        # decision, not a code defect, and failing every merge on it would
        # make the gate unusable.
        #
        # On a tag it checks that the tag names the version the tree
        # declares. It cannot check that the release is published, because
        # this workflow is what creates it -- that check would be circular
        # and would fail the very job that publishes the release.
        #
        # bash, not the Windows runner's default pwsh: `if [ ... ]; then` is
        # a PowerShell ParserError.
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            python scripts/check_release_freshness.py --tag "${{ github.ref_name }}"
          else
            python scripts/check_release_freshness.py
          fi

      # ── Frontend gate: typecheck -> tests -> production bundle ──
      # Packaging must not start unless the frontend passes all three gates.
      - name: Verify dependency lock integrity
        # Fail before packaging when the canonical frontend npm lock is stale
        # or unmirrored against frontend/package.json.
        run: python scripts/verify_dependency_locks.py
      - name: Audit Python dependencies for advisories
        # Dependabot's pip resolver cannot regenerate these uv-compiled locks,
        # so pip-audit is the deterministic vulnerability gate for every
        # committed Python lock. --disable-pip reads the pins straight from the
        # lock: these files are fully hash-pinned, so resolving them would add
        # nothing and would try to build PyGObject, which needs system headers
        # this runner does not provide.
        #
        # pip-audit evaluates PEP 508 markers against the runner, so pins that
        # only apply to another operating system would be skipped. Audit a
        # platform-neutral projection of each lock so every pinned package is
        # checked on every platform.
        run: >
          python scripts/audit_lock_all_platforms.py
          requirements-lock.txt
          requirements-dev-lock.txt
          requirements-linux-gui-lock.txt
      - name: Set up Node.js 24.15.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
      - name: Build React frontend
        run: |
          cd frontend
          npm ci
          npm run typecheck
          npm test
          npm run build
          cd ..
      - name: Audit frontend dependencies for advisories
        # Block packaging on any known npm advisory in the shipped dependency
        # tree, including dev-only packages that reach the build toolchain.
        run: npm audit --package-lock-only --audit-level=low --include=dev
        working-directory: frontend

      # ── Mandatory Python Test Suite Gate (includes frontend bundle check) ──
      - name: Run Python unit and integration test suite
        env:
          PREVIEWGEN_REQUIRE_FRONTEND_BUNDLE: "1"
        run: |
          python -m pytest tests/ -v -W error::pytest.PytestUnraisableExceptionWarning
      # ── Build with PyInstaller (native windowed .app on macOS) ──
      - name: Build executable
        shell: bash
        run: |
          pyinstaller --noconsole --name PreviewGen --icon=app.ico \
            ${{ runner.os == 'Linux' && '--additional-hooks-dir hooks' || '' }} \
            --add-data "app.ico${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "frontend/dist${{ runner.os == 'Windows' && ';' || ':' }}frontend/dist" \
            --add-data "previewgen/settings_schema.json${{ runner.os == 'Windows' && ';' || ':' }}previewgen" \
            --collect-all psd_tools --collect-all trimesh --collect-all webview \
            --collect-all resvg_py --collect-all matplotlib \
            --collect-all cascadio --collect-all ezdxf --collect-all olefile \
            --collect-all collada \
            ${{ runner.os == 'Linux' && '--collect-all setuptools' || '' }} \
            --collect-all pypdfium2 --collect-all pypdfium2_raw --collect-all fontTools --collect-all brotli \
            --collect-all lxml --collect-all networkx \
            ${{ runner.os == 'macOS' && '--osx-bundle-identifier com.zenartisan.previewgen --windowed' || '' }} \
            app.py --clean -y

      - name: Delegate Linux graphics libraries to the host
        if: runner.os == 'Linux'
        run: |
          # WebKitGTK's renderer must use the host's EGL/Mesa stack. Freezing
          # Ubuntu 22.04's libepoxy/libgbm shadows the newer graphics runtime
          # on Ubuntu 24.04 and aborts WebKitWebProcess with EGL_BAD_PARAMETER.
          rm -f dist/PreviewGen/_internal/libepoxy.so.0 dist/PreviewGen/_internal/libgbm.so.1
          test ! -e dist/PreviewGen/_internal/libepoxy.so.0
          test ! -e dist/PreviewGen/_internal/libgbm.so.1

      - name: Verify frozen Linux WebKitGTK bundle
        if: runner.os == 'Linux'
        run: python scripts/verify_linux_webkit_bundle.py dist/PreviewGen

      # Issue #20: a policy string no engine enforces is not a control. Prove
      # the shipped directives in WebKitGTK against both the built HTML and the
      # copy PyInstaller froze into the artifact. The clean-machine jobs below
      # also run a narrower script/preview smoke in each packaged WebView.
      - name: Verify production CSP in WebKit
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p build_diagnostics
          xvfb-run -a python scripts/verify_csp_webview.py \
            --report build_diagnostics/csp-webview.json
          packaged_html="$(find dist/PreviewGen -path '*/frontend/dist/index.html' -print -quit)"
          test -n "$packaged_html" || { echo "FATAL: packaged frontend HTML not found"; exit 1; }
          xvfb-run -a python scripts/verify_csp_webview.py \
            --dist "$packaged_html" \
            --report build_diagnostics/csp-webview-packaged.json

      # The studio palette is assembled from several :root blocks, and the last
      # imported stylesheet wins. A token can therefore be "fixed" in a file
      # that never reaches the browser, so measure the computed colours of the
      # shipped bundle in WebKitGTK instead of trusting the CSS source.
      - name: Verify theme contrast in WebKit
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p build_diagnostics
          xvfb-run -a python scripts/verify_theme_contrast.py \
            --report build_diagnostics/theme-contrast.json
          packaged_html="$(find dist/PreviewGen -path '*/frontend/dist/index.html' -print -quit)"
          test -n "$packaged_html" || { echo "FATAL: packaged frontend HTML not found"; exit 1; }
          xvfb-run -a python scripts/verify_theme_contrast.py \
            --dist "$packaged_html" \
            --report build_diagnostics/theme-contrast-packaged.json

      - name: Collect build diagnostics and renderer versions
        shell: bash
        run: |
          mkdir -p build_diagnostics
          cp build/PreviewGen/warn-PreviewGen.txt build_diagnostics/ 2>/dev/null || true
          python -c "
          import sys, PIL, trimesh, psd_tools, resvg_py, ezdxf, cascadio, collada
          print('Python:', sys.version)
          print('Pillow:', PIL.__version__)
          print('trimesh:', trimesh.__version__)
          print('psd-tools:', psd_tools.__version__)
          print('ezdxf:', ezdxf.__version__)
          print('cascadio:', getattr(cascadio, '__version__', 'installed'))
          print('pycollada:', collada.__version__)
          " > build_diagnostics/renderer_versions.txt 2>&1 || true

      - name: Upload build diagnostics artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.artifact }}
          path: build_diagnostics/

      # ── Packaged (frozen) renderer gate ──
      # Source imports do not prove the packaged app supports every format;
      # exercise the actual frozen artifact against the deterministic fixtures.
      - name: Verify frozen artifact renders fixtures (packaged gate)
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) export PREVIEWGEN_BINARY="dist/PreviewGen/PreviewGen.exe" ;;
            macOS)   export PREVIEWGEN_BINARY="dist/PreviewGen.app/Contents/MacOS/PreviewGen" ;;
            *)       export PREVIEWGEN_BINARY="dist/PreviewGen/PreviewGen" ;;
          esac
          # Enforce a real packaged binary in the release pipeline (fail-closed before pytest runs)
          test -n "$PREVIEWGEN_BINARY" || { echo "FATAL: PREVIEWGEN_BINARY is empty or unset"; exit 1; }
          test -f "$PREVIEWGEN_BINARY" || { echo "FATAL: Frozen artifact not found: $PREVIEWGEN_BINARY"; exit 1; }
          export PREVIEWGEN_RELEASE_GATE=1
          python -m pytest tests/integration/test_release_renderers_gate.py -v -W error
      - name: Windows Startup Test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Running Windows startup smoke test..."
          $proc = Start-Process -FilePath "dist\PreviewGen\PreviewGen.exe" -ArgumentList "--smoke-test" -NoNewWindow -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "Windows startup test failed with exit code $($proc.ExitCode)"
          }
          Write-Host "Windows startup smoke test passed successfully!"

      - name: Sign Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # PreviewGen is a free, MIT-licensed project and does not buy a
          # code-signing certificate. Signing is therefore optional: the
          # binary is signed when a certificate is configured, and shipped
          # unsigned otherwise. The README states plainly that the release is
          # unsigned and that users must confirm the checksum themselves.
          if ("${{ secrets.WINDOWS_CERTIFICATE }}" -ne "") {
            Write-Host "Signing Windows binary with certificate..."
            $certBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}")
            [IO.File]::WriteAllBytes("cert.pfx", $certBytes)
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe not found in the installed Windows SDK." }
            & $signtool.FullName sign /f cert.pfx /p "${{ secrets.WINDOWS_CERTIFICATE_PWD }}" /tr http://timestamp.digicert.com /td sha256 /fd sha256 dist\PreviewGen\PreviewGen.exe
            if ($LASTEXITCODE -ne 0) { throw "Signing PreviewGen.exe failed." }
            Remove-Item cert.pfx -Force
          } else {
            Write-Host "Notice: No WINDOWS_CERTIFICATE secret configured. Skipping Windows binary signing."
          }

      - name: Verify Windows executable signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # `signtool sign` returning zero is not proof that the artifact carries
          # a valid signature: a malformed or partially signed binary can still
          # exit zero. Read the signature back and require a real one.
          #
          # PreviewGen is a free, MIT-licensed project and does not buy a
          # code-signing certificate, so an unsigned build is the normal case.
          # The check therefore applies only to a build that was actually
          # signed: when a certificate is configured, a bad signature is a hard
          # failure; when none is configured, there is nothing to verify.
          if ("${{ secrets.WINDOWS_CERTIFICATE }}" -eq "") {
            Write-Host "Notice: No WINDOWS_CERTIFICATE secret configured; the binary is unsigned and there is no signature to verify."
            exit 0
          }
          $target = "dist\PreviewGen\PreviewGen.exe"
          if (-not (Test-Path $target)) { throw "FATAL: $target is missing; nothing was signed." }
          $status = Get-AuthenticodeSignature $target
          Write-Host "Authenticode status: $($status.Status) (subject: $($status.SignerCertificate.Subject))"
          if ($status.Status -ne "Valid") {
            throw "FATAL: $target is not validly signed (status: $($status.Status)). Refusing to publish."
          }
          if (-not $status.SignerCertificate) {
            throw "FATAL: $target has no signer certificate. Refusing to publish."
          }
          if ($status.TimeStamperCertificate) {
            Write-Host "Timestamped by: $($status.TimeStamperCertificate.Subject)"
          } else {
            throw "FATAL: $target carries no RFC3161 timestamp; the signature will expire with the certificate."
          }

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item install_desktop_icon.bat dist\PreviewGen\Install-Desktop-Icon.bat
          Copy-Item app.ico dist\PreviewGen\app.ico
          Copy-Item USER_GUIDE.txt dist\PreviewGen\USER_GUIDE.txt
          Compress-Archive -Path dist\PreviewGen\* -DestinationPath PreviewGen-Windows.zip -Force
          # Compile Inno Setup installer wizard (PreviewGen-Setup.exe)
          $appVersion = (python -c "from previewgen import __version__; print(__version__)").Trim()
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$appVersion") { throw "Release tag mismatch: expected v$appVersion." }
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DMyAppVersion=$appVersion" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          Move-Item dist\PreviewGen-Setup.exe .

      - name: Sign Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Signing is optional for this unsigned, MIT-licensed project: the
          # installer is signed when a certificate is configured and shipped
          # unsigned otherwise.
          if ("${{ secrets.WINDOWS_CERTIFICATE }}" -ne "" -and (Test-Path "PreviewGen-Setup.exe")) {
            Write-Host "Signing Windows setup installer..."
            $certBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}")
            [IO.File]::WriteAllBytes("cert.pfx", $certBytes)
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe not found in the installed Windows SDK." }
            & $signtool.FullName sign /f cert.pfx /p "${{ secrets.WINDOWS_CERTIFICATE_PWD }}" /tr http://timestamp.digicert.com /td sha256 /fd sha256 PreviewGen-Setup.exe
            if ($LASTEXITCODE -ne 0) { throw "Signing PreviewGen-Setup.exe failed." }
            Remove-Item cert.pfx -Force
          }

      - name: Verify Windows installer signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # An unsigned installer is the normal case for this unsigned,
          # MIT-licensed project. Only verify a signature that was applied.
          if ("${{ secrets.WINDOWS_CERTIFICATE }}" -eq "") {
            Write-Host "Notice: No WINDOWS_CERTIFICATE secret configured; the installer is unsigned and there is no signature to verify."
            exit 0
          }
          $target = "PreviewGen-Setup.exe"
          if (-not (Test-Path $target)) { throw "FATAL: $target is missing; nothing was signed." }
          $status = Get-AuthenticodeSignature $target
          Write-Host "Installer Authenticode status: $($status.Status) (subject: $($status.SignerCertificate.Subject))"
          if ($status.Status -ne "Valid") {
            throw "FATAL: $target is not validly signed (status: $($status.Status)). Refusing to publish."
          }
          if (-not $status.SignerCertificate) {
            throw "FATAL: $target has no signer certificate. Refusing to publish."
          }
          if (-not $status.TimeStamperCertificate) {
            throw "FATAL: $target carries no RFC3161 timestamp; the signature will expire with the certificate."
          }

      # ── macOS: Genuine .app bundle, Code Signing, Startup test & DMG ──
      - name: Package macOS build
        if: runner.os == 'macOS'
        run: |
          test -d "dist/PreviewGen.app" || { echo "FATAL: PyInstaller did not generate dist/PreviewGen.app"; exit 1; }
          test -f "dist/PreviewGen.app/Contents/MacOS/PreviewGen" || { echo "FATAL: Missing executable inside dist/PreviewGen.app"; exit 1; }
          mkdir -p dmg_staging
          cp -R dist/PreviewGen.app dmg_staging/

      - name: Sign macOS Application
        if: runner.os == 'macOS'
        run: |
          APP_PATH="dmg_staging/PreviewGen.app"
          # PreviewGen is a free, MIT-licensed project and does not buy an
          # Apple Developer certificate. Signing and notarization are
          # therefore optional: the app is signed when a certificate is
          # configured and shipped ad-hoc signed otherwise.
          if [ -n "${{ secrets.MACOS_CERTIFICATE }}" ]; then
            echo "Importing Apple Developer Certificate..."
            echo "${{ secrets.MACOS_CERTIFICATE }}" | base64 --decode > certificate.p12
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            security create-keychain -p "" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "" $KEYCHAIN_PATH
            security import certificate.p12 -k $KEYCHAIN_PATH -P "${{ secrets.MACOS_CERTIFICATE_PWD }}" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH
            codesign --deep --force --options runtime --timestamp --sign "${{ secrets.MACOS_DEVELOPER_IDENTITY }}" "$APP_PATH" \
              || { echo "::error::codesign failed for $APP_PATH"; exit 1; }
            codesign --verify --deep --strict --verbose=2 "$APP_PATH" \
              || { echo "::error::codesign verification failed for $APP_PATH"; exit 1; }
            codesign --display --verbose=2 "$APP_PATH"
            rm -f certificate.p12
          else
            echo "Notice: No MACOS_CERTIFICATE configured. Applying ad-hoc signature..."
            codesign --force --deep --sign - "$APP_PATH"
          fi

      - name: macOS Startup Test
        if: runner.os == 'macOS'
        run: |
          echo "Running macOS startup smoke test..."
          ./dmg_staging/PreviewGen.app/Contents/MacOS/PreviewGen --smoke-test

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "PreviewGen" -srcfolder dmg_staging -ov -format UDZO PreviewGen-macOS.dmg

      - name: Notarize and staple macOS DMG
        if: runner.os == 'macOS'
        run: |
          # Notarization requires a paid Apple Developer membership, which
          # this free, MIT-licensed project does not have. The DMG is
          # notarized when the credentials are configured and shipped
          # unnotarized otherwise; the README tells users to expect the
          # Gatekeeper warning and to verify the SHA-256 checksum.
          if [ -n "${{ secrets.APPLE_ID }}" ] && [ -n "${{ secrets.APPLE_TEAM_ID }}" ] && [ -n "${{ secrets.APPLE_APP_PASSWORD }}" ]; then
            echo "Submitting DMG to Apple notary service..."
            xcrun notarytool submit PreviewGen-macOS.dmg \
              --apple-id "${{ secrets.APPLE_ID }}" \
              --team-id "${{ secrets.APPLE_TEAM_ID }}" \
              --password "${{ secrets.APPLE_APP_PASSWORD }}" \
              --wait
            echo "Stapling notarization ticket to DMG..."
            xcrun stapler staple PreviewGen-macOS.dmg
            xcrun stapler validate PreviewGen-macOS.dmg
          else
            echo "Notice: Notarization secrets not configured. Skipping notarization..."
          fi

      # ── Linux: Startup test & Genuine AppImage ──
      - name: Linux Startup Test
        if: runner.os == 'Linux'
        run: |
          echo "Running Linux executable smoke test..."
          xvfb-run -a ./dist/PreviewGen/PreviewGen --smoke-test

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p PreviewGen.AppDir/usr/bin
          mkdir -p PreviewGen.AppDir/usr/share/applications
          mkdir -p PreviewGen.AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/PreviewGen/* PreviewGen.AppDir/usr/bin/
          python -c "from PIL import Image; Image.open('app.ico').save('PreviewGen.AppDir/previewgen.png')"
          cp PreviewGen.AppDir/previewgen.png PreviewGen.AppDir/.DirIcon
          cp PreviewGen.AppDir/previewgen.png PreviewGen.AppDir/usr/share/icons/hicolor/256x256/apps/previewgen.png

          cat > PreviewGen.AppDir/previewgen.desktop << 'EOF'
          [Desktop Entry]
          Name=PreviewGen
          Exec=PreviewGen
          Icon=previewgen
          Type=Application
          Categories=Graphics;
          Comment=Transparent PNG to JPG Preview Generator
          EOF
          cp PreviewGen.AppDir/previewgen.desktop PreviewGen.AppDir/usr/share/applications/previewgen.desktop

          cat > PreviewGen.AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/PreviewGen" "$@"
          APPRUN
          chmod +x PreviewGen.AppDir/AppRun
          # Pin the AppImage tooling to a stable release and verify its checksum
          # before execution (immutable, auditable build dependency).
          APPIMAGETOOL_VERSION="1.9.1"
          APPIMAGETOOL_URL="https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          APPIMAGETOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          wget -q "$APPIMAGETOOL_URL" -O appimagetool
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c - || {
            echo "FATAL: appimagetool checksum verification failed"; exit 1;
          }
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool PreviewGen.AppDir PreviewGen-Linux.AppImage
          test -f PreviewGen-Linux.AppImage || { echo "FATAL: appimagetool failed to create PreviewGen-Linux.AppImage"; exit 1; }
          chmod +x PreviewGen-Linux.AppImage

      - name: Verify final Linux AppImage
        if: runner.os == 'Linux'
        run: python scripts/verify_linux_webkit_bundle.py PreviewGen-Linux.AppImage

      # ── Upload artifact ──
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            PreviewGen-Setup.exe
            PreviewGen-Windows.zip
            PreviewGen-macOS.dmg
            PreviewGen-Linux.AppImage

  # ── Isolated Clean Machine Tests (WITHOUT Python or Node.js) ──
  clean-machine-test:
    name: Clean Machine Test (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PreviewGen-Windows
          - os: macos-latest
            artifact: PreviewGen-macOS
          - os: ubuntu-22.04
            artifact: PreviewGen-Linux
          - os: ubuntu-24.04
            artifact: PreviewGen-Linux

    runs-on: ${{ matrix.os }}
    steps:
      # Crucial: NO actions/setup-python and NO actions/setup-node installed here!
      - name: Checkout render fixtures (source only, no toolchain)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download compiled artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}

      - name: Test on clean Windows machine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Unpacking Windows artifact on machine without project Python/Node..."
          Expand-Archive -Path PreviewGen-Windows.zip -DestinationPath test_clean_win
          # `--smoke-test` is the headless processor check and never opens a window, so it
          # cannot exercise pywebview's bridge injection - the path that hung real Windows
          # installs in issue #19. `--gui-smoke-test` creates the hidden WebView2 window,
          # injects the bridge, and only writes the marker once the frontend reports ready.
          $env:PREVIEWGEN_READY_MARKER = "$PWD\gui_ready.txt"
          # Keep the bounded script/preview smoke verdict separate from engine diagnostics.
          $env:PREVIEWGEN_CSP_MARKER = "$PWD\csp_selftest.json"
          $env:PREVIEWGEN_CSP_VIOLATIONS = "$PWD\csp_violations.jsonl"
          $logFile = "$env:LOCALAPPDATA\PreviewGen\logs\previewgen.log"
          $timeoutSec = 180

          # WebView2 launches its browser process out of process. On a busy
          # runner that process can abort while it is being created
          # (E_ABORT from CreateCoreWebView2ControllerAsync), before the
          # frontend is ever parsed. That is an environment condition, not a
          # defect in the package, so retry the launch a few times before
          # failing. A bridge injection error is a real regression and is
          # still checked after the retry loop, so it cannot be masked.
          $maxAttempts = 3
          $ready = $false
          $lastError = ""
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Remove-Item $logFile -ErrorAction SilentlyContinue
            Remove-Item $env:PREVIEWGEN_READY_MARKER -ErrorAction SilentlyContinue
            Remove-Item $env:PREVIEWGEN_CSP_MARKER -ErrorAction SilentlyContinue
            Remove-Item $env:PREVIEWGEN_CSP_VIOLATIONS -ErrorAction SilentlyContinue
            Remove-Item "$PWD\gui_stdout.log" -ErrorAction SilentlyContinue
            Remove-Item "$PWD\gui_stderr.log" -ErrorAction SilentlyContinue
            Write-Host "GUI smoke test attempt $attempt of $maxAttempts..."
            $proc = Start-Process -FilePath "test_clean_win\PreviewGen.exe" -ArgumentList "--gui-smoke-test" -NoNewWindow -PassThru -RedirectStandardOutput "$PWD\gui_stdout.log" -RedirectStandardError "$PWD\gui_stderr.log"
            $elapsed = 0
            while (-not $proc.HasExited -and $elapsed -lt $timeoutSec) {
              Start-Sleep -Seconds 1
              $elapsed++
            }
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
              Get-Content "$PWD\gui_stdout.log" -ErrorAction SilentlyContinue
              Get-Content "$PWD\gui_stderr.log" -ErrorAction SilentlyContinue
              Get-Content $logFile -ErrorAction SilentlyContinue
              throw "Clean machine Windows GUI smoke test timed out after $timeoutSec seconds."
            }
            if ($proc.ExitCode -ne 0) {
              Get-Content "$PWD\gui_stdout.log" -ErrorAction SilentlyContinue
              Get-Content "$PWD\gui_stderr.log" -ErrorAction SilentlyContinue
              Get-Content $logFile -ErrorAction SilentlyContinue
              throw "Clean machine Windows execution failed with code $($proc.ExitCode)"
            }
            if (Test-Path $env:PREVIEWGEN_READY_MARKER) {
              $ready = $true
              break
            }
            # The window never became ready. Capture why, then decide whether
            # the cause is worth another attempt.
            Get-Content $logFile -ErrorAction SilentlyContinue | Out-String | ForEach-Object { $lastError = $_ }
            $isBrowserAbort = (Test-Path $logFile) -and (Select-String -Path $logFile -Pattern 'WebView2 initialization failed|E_ABORT' -Quiet)
            if (-not $isBrowserAbort) {
              throw "FATAL: frontend_ready marker not written; the packaged WebView never became ready."
            }
            # Keep the aborted attempt's log so the failure is diagnosable
            # even when a later attempt succeeds.
            Copy-Item $logFile "$PWD\gui_aborted_attempt_$attempt.log" -ErrorAction SilentlyContinue
            Write-Host "The WebView2 browser process aborted during startup; retrying."
            Start-Sleep -Seconds 10
          }
          if (-not $ready) {
            Write-Host $lastError
            throw "FATAL: frontend_ready marker not written after $maxAttempts attempts; the packaged WebView never became ready."
          }
          # pywebview logs one "Error while processing <dotted .NET path>" per bridge
          # name when the introspection walk runs away. Any occurrence means the
          # injection storm that starves the message pump is back.
          if ((Test-Path $logFile) -and (Select-String -Path $logFile -Pattern 'Error while processing|Error occurred in script' -Quiet)) {
            Select-String -Path $logFile -Pattern 'Error while processing|Error occurred in script' | Select-Object -First 5
            throw "FATAL: bridge injection errors in the packaged Windows run (issue #19 regression)."
          }
          # No project toolchain is needed to check the verdict on Windows.
          if (-not (Test-Path $env:PREVIEWGEN_CSP_MARKER)) {
            throw "FATAL: the packaged Windows run produced no CSP self-test result."
          }
          $cspResult = Get-Content $env:PREVIEWGEN_CSP_MARKER -Raw
          Write-Host "CSP self-test result: $cspResult"
          $verdict = ConvertFrom-Json -InputObject $cspResult -AsHashtable -NoEnumerate
          if ($verdict -isnot [System.Collections.IDictionary] -or
              $verdict.inlineScript -isnot [string] -or
              $verdict.blobScript -isnot [string] -or
              $verdict.previewJpeg -isnot [string] -or
              $verdict.Contains('error') -or
              $verdict.inlineScript -cne 'blocked' -or
              $verdict.blobScript -cne 'blocked' -or
              $verdict.previewJpeg -cne 'loaded') {
            throw "FATAL: packaged WebView2 CSP/preview smoke failed."
          }
          Write-Host "Verifying frozen binary render capabilities (all fixtures)..."
          $renderProc = Start-Process -FilePath "test_clean_win\PreviewGen.exe" -ArgumentList "--render-test-all --fixtures tests/fixtures" -NoNewWindow -Wait -PassThru
          if ($renderProc.ExitCode -ne 0) {
            throw "Clean machine Windows frozen render test (all fixtures) failed with code $($renderProc.ExitCode)"
          }
          Write-Host "Windows clean machine test passed successfully!"

      - name: Test on clean macOS machine
        if: runner.os == 'macOS'
        run: |
          echo "Mounting macOS DMG on machine without project Python/Node..."
          hdiutil attach PreviewGen-macOS.dmg -mountpoint /Volumes/PreviewGenTest
          export PREVIEWGEN_READY_MARKER="$PWD/gui_ready.txt"
          # Engine violations are diagnostic only, including deliberate smoke probes.
          export PREVIEWGEN_CSP_MARKER="$PWD/csp_selftest.json"
          export PREVIEWGEN_CSP_VIOLATIONS="$PWD/csp_violations.jsonl"
          rm -f "$PREVIEWGEN_READY_MARKER" "$PREVIEWGEN_CSP_MARKER" "$PREVIEWGEN_CSP_VIOLATIONS"
          # The packaged app gets a bounded budget to mount the frontend and
          # then a separate budget to run the CSP probe in the live WebView,
          # so the timeout here must cover both plus process startup.
          python3 -c "import subprocess, sys, time; proc = subprocess.Popen(['/Volumes/PreviewGenTest/PreviewGen.app/Contents/MacOS/PreviewGen', '--gui-smoke-test']); sys.exit(proc.wait(timeout=180))" || {
            cat ~/Library/Logs/PreviewGen/previewgen.log 2>/dev/null || true
            echo "FATAL: macOS GUI test failed or timed out after 180s"; exit 1;
          }
          test -f "$PWD/gui_ready.txt" || {
            cat ~/Library/Logs/PreviewGen/previewgen.log 2>/dev/null || true
            echo "FATAL: frontend_ready marker not found on macOS"; exit 1;
          }
          python3 scripts/check_csp_marker.py --marker "$PREVIEWGEN_CSP_MARKER"
          echo "Verifying frozen binary render capabilities on macOS (all fixtures)..."
          /Volumes/PreviewGenTest/PreviewGen.app/Contents/MacOS/PreviewGen --render-test-all --fixtures tests/fixtures
          if [ $? -ne 0 ]; then
            echo "FATAL: macOS frozen render test (all fixtures) failed"
            exit 1
          fi
      - name: Test on clean Linux machine
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo "Testing Linux AppImage on machine without project Python/Node..."
          sudo apt-get update
          sudo apt-get install -y xvfb weston libfuse2 python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 || sudo apt-get install -y xvfb weston libfuse2 python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.0
          chmod +x PreviewGen-Linux.AppImage

          # The manifest records the exact build-host WebKitGTK package and the
          # selected library/injected-bundle pair. Ubuntu 24.04 is useful only
          # when its installed host package is genuinely newer than the build
          # host package, so enforce that ordering instead of trusting labels.
          rm -rf appimage-extract
          mkdir appimage-extract
          (cd appimage-extract && ../PreviewGen-Linux.AppImage --appimage-extract >/dev/null)
          manifest="appimage-extract/squashfs-root/usr/bin/_internal/webkit_injected_bundle/webkit_manifest.json"
          test -f "$manifest" || { echo "FATAL: WebKitGTK provenance manifest not found in AppImage"; exit 1; }
          build_webkit_version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["package_version"])' "$manifest")
          host_webkit_version=$(dpkg-query -W -f='${Version}' libwebkit2gtk-4.1-0)
          echo "Build-host WebKitGTK package: $build_webkit_version"
          echo "Acceptance-host WebKitGTK package: $host_webkit_version"
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ]; then
            dpkg --compare-versions "$host_webkit_version" gt "$build_webkit_version" || {
              echo "FATAL: acceptance host WebKitGTK package is not newer than the build-host package"
              exit 1
            }
          fi

          # Engine violations are diagnostic only, including deliberate smoke probes.
          export PREVIEWGEN_CSP_MARKER="$PWD/csp_selftest.json"
          export PREVIEWGEN_CSP_VIOLATIONS="$PWD/csp_violations.jsonl"
          journal_since=$(date --iso-8601=seconds)

          # Start Xvfb directly. xvfb-run adds an Xauthority cookie that
          # WebKit's sandboxed renderer does not always inherit; without the
          # cookie the renderer can fail EGL display setup on newer hosts.
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp > previewgen-xvfb-server.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            test -S /tmp/.X11-unix/X99 && break
            sleep 0.1
          done
          test -S /tmp/.X11-unix/X99 || {
            echo "FATAL: Xvfb display :99 did not start"
            cat previewgen-xvfb-server.log
            exit 1
          }

          export PREVIEWGEN_READY_MARKER="$PWD/gui_ready_xvfb.txt"
          rm -f "$PREVIEWGEN_READY_MARKER" "$PREVIEWGEN_CSP_MARKER" "$PREVIEWGEN_CSP_VIOLATIONS"
          timeout 60s env -u WAYLAND_DISPLAY DISPLAY=:99 GDK_BACKEND=x11 EGL_PLATFORM=x11 __EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 LIBGL_ALWAYS_SOFTWARE=1 ./appimage-extract/squashfs-root/AppRun --gui-smoke-test > previewgen-gui-xvfb.log 2>&1 || {
            echo "FATAL: Linux Xvfb GUI smoke test failed or timed out after 60s"
            cat previewgen-gui-xvfb.log
            cat ~/.local/state/previewgen/previewgen.log 2>/dev/null || true
            exit 1
          }
          test -f "$PWD/gui_ready_xvfb.txt" || {
            echo "FATAL: frontend_ready marker not found in Xvfb"
            cat previewgen-gui-xvfb.log
            exit 1
          }

          export PREVIEWGEN_READY_MARKER="$PWD/gui_ready_x11.txt"
          rm -f "$PREVIEWGEN_READY_MARKER"
          timeout 60s env -u WAYLAND_DISPLAY DISPLAY=:99 GDK_BACKEND=x11 EGL_PLATFORM=x11 __EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 LIBGL_ALWAYS_SOFTWARE=1 ./appimage-extract/squashfs-root/AppRun --gui-smoke-test > previewgen-gui-x11.log 2>&1 || {
            echo "FATAL: Linux X11 GUI smoke test failed or timed out after 60s"
            cat previewgen-gui-x11.log
            exit 1
          }
          test -f "$PWD/gui_ready_x11.txt" || {
            echo "FATAL: frontend_ready marker not found in X11"
            cat previewgen-gui-x11.log
            exit 1
          }

          export XDG_RUNTIME_DIR="$PWD/xdg-runtime"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-previewgen --idle-time=0 > previewgen-weston.log 2>&1 &
          weston_pid=$!
          for attempt in $(seq 1 100); do
            test -S "$XDG_RUNTIME_DIR/wayland-previewgen" && break
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/wayland-previewgen" || {
            echo "FATAL: headless Wayland compositor did not start"
            cat previewgen-weston.log
            kill "$weston_pid" 2>/dev/null || true
            exit 1
          }
          export PREVIEWGEN_READY_MARKER="$PWD/gui_ready_wayland.txt"
          rm -f "$PREVIEWGEN_READY_MARKER"
          env -u DISPLAY WAYLAND_DISPLAY=wayland-previewgen GDK_BACKEND=wayland EGL_PLATFORM=wayland __EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 LIBGL_ALWAYS_SOFTWARE=1 timeout 60s ./appimage-extract/squashfs-root/AppRun --gui-smoke-test > previewgen-gui-wayland.log 2>&1 || {
            echo "FATAL: Linux Wayland GUI smoke test failed or timed out after 60s"
            cat previewgen-gui-wayland.log
            kill "$weston_pid" 2>/dev/null || true
            exit 1
          }
          kill "$weston_pid" 2>/dev/null || true
          wait "$weston_pid" 2>/dev/null || true
          test -f "$PWD/gui_ready_wayland.txt" || {
            echo "FATAL: frontend_ready marker not found in Wayland"
            cat previewgen-gui-wayland.log
            exit 1
          }

          renderer_crashes=$(journalctl --since "$journal_since" --no-pager 2>/dev/null | grep -Ei 'WKBundleInitialize|libwebkit2gtkinjectedbundle.*(segfault|core dump)|WebKitWebProcess.*(crash|segfault|core dump)' || true)
          if [ -n "$renderer_crashes" ]; then
            echo "FATAL: WebKitGTK renderer crash detected"
            echo "$renderer_crashes"
            exit 1
          fi

          python3 scripts/check_csp_marker.py --marker "$PREVIEWGEN_CSP_MARKER"
          echo "Verifying frozen AppImage render capabilities on Linux (all fixtures)..."
          ./PreviewGen-Linux.AppImage --render-test-all --fixtures tests/fixtures
          if [ $? -ne 0 ]; then
            echo "FATAL: Linux frozen render test (all fixtures) failed"
            exit 1
          fi

      - name: Upload packaged CSP evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-csp-${{ matrix.artifact }}-${{ matrix.os }}
          path: |
            gui_ready_xvfb.txt
            gui_ready_x11.txt
            gui_ready_wayland.txt
            csp_selftest.json
            csp_violations.jsonl
            previewgen-gui-*.log
            previewgen-weston.log
          if-no-files-found: ignore

  # ── Stage signed release artifacts for manual native QA sign-off ──
  release:
    permissions:
      contents: write
    needs: [build, clean-machine-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release user guide
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: PreviewGen-*
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          echo "Generating SHA-256 checksums for release verification..."
          sha256sum PreviewGen-Setup.exe PreviewGen-Windows.zip \
            PreviewGen-macOS.dmg PreviewGen-Linux.AppImage > SHA256SUMS.txt
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Sign release checksums with GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
        run: |
          # A checksum published in the same channel as the artifact proves
          # nothing against a tampered download: an attacker who can replace
          # the AppImage can replace the checksum file too. A detached GPG
          # signature lets a user verify the checksums against a key they
          # already trust, independently of this release.
          #
          # PreviewGen is a free, MIT-licensed project and does not buy a
          # code-signing certificate. A GPG signing key is likewise optional:
          # when one is configured the checksums are signed and the public key
          # is published beside them; when none is configured the release still
          # ships the SHA-256 file, and the README states plainly that a
          # checksum alone is integrity checking, not publisher
          # authentication.
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_KEY_ID" ]; then
            echo "::notice::No GPG signing key configured; publishing SHA256SUMS.txt without a detached signature."
            exit 0
          fi

          echo "$GPG_PRIVATE_KEY" | base64 --decode > "$RUNNER_TEMP/release-signing-key.asc"
          chmod 600 "$RUNNER_TEMP/release-signing-key.asc"
          gpg --batch --import "$RUNNER_TEMP/release-signing-key.asc"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --local-user "$GPG_KEY_ID" \
            --armor --detach-sign --output SHA256SUMS.txt.asc SHA256SUMS.txt
          # Verify the signature we just produced, so a broken key or a
          # misconfigured passphrase cannot ship a useless signature.
          gpg --batch --verify SHA256SUMS.txt.asc SHA256SUMS.txt
          # Publish the public key beside the signature so install.ps1 can
          # verify the checksums without the user hunting for it.
          gpg --batch --armor --export "$GPG_KEY_ID" > previewgen-signing-key.asc
          test -s previewgen-signing-key.asc || { echo "::error::Failed to export the release public key."; exit 1; }
          rm -f "$RUNNER_TEMP/release-signing-key.asc"
          echo "Release checksums are signed by $GPG_KEY_ID"

      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Hosted smoke does not satisfy the native evidence checklist.
          #
          # The detached signature and its public key exist only when a GPG
          # key is configured, so they are attached conditionally rather than
          # being named unconditionally and failing the release.
          assets=(
            PreviewGen-Setup.exe PreviewGen-Windows.zip
            PreviewGen-macOS.dmg PreviewGen-Linux.AppImage
            SHA256SUMS.txt USER_GUIDE.txt
          )
          if [ -f SHA256SUMS.txt.asc ] && [ -f previewgen-signing-key.asc ]; then
            assets+=(SHA256SUMS.txt.asc previewgen-signing-key.asc)
          else
            echo "::notice::Publishing without a detached checksum signature (no GPG key configured)."
          fi
          gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes "${assets[@]}"
