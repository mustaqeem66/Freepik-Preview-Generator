name: Pull Request Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Python and React regression checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Install locked Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev-lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
      - name: Frontend gates
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Backend gates
        env:
          PREVIEWGEN_REQUIRE_FRONTEND_BUNDLE: "1"
        run: |
          python -m ruff check .
          python -m pytest tests/ -q

  windows-gui:
    name: Windows WebView2 GUI startup
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Install locked Python requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev-lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
      - name: Build frontend bundle
        shell: pwsh
        run: |
          Push-Location frontend
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "frontend build failed" }
          Pop-Location
      - name: Verify Windows watchdog and desktop runtime tests
        shell: pwsh
        run: |
          python -m pytest tests/unit/test_ui_watchdog.py tests/unit/test_desktop_runtime.py tests/unit/test_startup_responsiveness.py -q
          if ($LASTEXITCODE -ne 0) { throw "Windows unit tests failed" }
      - name: Real Windows GUI bridge handshake (source)
        shell: pwsh
        timeout-minutes: 3
        run: |
          # This is a GUI startup check, not a full prolonged idle-freeze reproduction.
          # Set an explicit readiness marker that DesktopApi.frontend_ready must create.
          $marker = Join-Path $env:RUNNER_TEMP "previewgen-gui-ready.txt"
          Remove-Item $marker -ErrorAction SilentlyContinue
          $env:PREVIEWGEN_READY_MARKER = $marker
          $proc = Start-Process -FilePath (Get-Command python).Source -ArgumentList @("app.py", "--gui-smoke-test") -PassThru
          $ready = $false
          try {
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep -Milliseconds 500
              if (Test-Path $marker) { $ready = $true; break }
              $proc.Refresh()
              if ($proc.HasExited) { break }
            }
            if (-not $ready) { throw "Windows GUI failed to report frontend_ready within 60 seconds" }
            $proc.WaitForExit(25000) | Out-Null
            $proc.Refresh()
            if (-not $proc.HasExited) { throw "GUI smoke window did not close after readiness" }
            if ($proc.ExitCode -ne 0) { throw "GUI exited with code $($proc.ExitCode)" }
          } finally {
            $proc.Refresh()
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }
